<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doc Verifier</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#161a23;--mu:#6b7280;--ln:#e5e7ee;--ac:#4f46e5;--acb:#eef0ff;--ok:#15803d;--okb:#e8f6ee;--bad:#b91c1c;--badb:#fdecec;--wr:#b45309;--wrb:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#eceef3;--mu:#9aa1b0;--ln:#2a2f3a;--ac:#8b85ff;--acb:#23233f;--ok:#4ade80;--okb:#12261a;--bad:#f87171;--badb:#2a1515;--wr:#fbbf24;--wrb:#2a2112}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700}
h1{font-size:15px;margin:0}header p{margin:0;color:var(--mu);font-size:12px}
.pill{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--ln);color:var(--mu);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
#cand{margin-bottom:10px}#cand b{display:block;font-size:14px}#cand span{color:var(--mu);font-size:12px}
.notice{border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:12px}
.notice.info{background:var(--acb);color:var(--ac)}.notice.warn{background:var(--wrb);color:var(--wr)}.notice.bad{background:var(--badb);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.btn{font:600 13px system-ui,sans-serif;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:9px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff;flex:1}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn[hidden]{display:none}
.sw{display:flex;gap:9px;align-items:center;cursor:pointer;margin:2px 0 12px}
.sw input{display:none}.sw .t{width:34px;height:20px;border-radius:99px;background:var(--ln);position:relative;transition:.2s;flex:none}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.t{background:var(--ac)}.sw input:checked+.t::after{left:16px}
.sw b{display:block;font-size:12px}.sw small{color:var(--mu);font-size:11px}
#bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}#bar[hidden]{display:none}
.track{flex:1;height:6px;border-radius:9px;background:var(--ln);overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
#cnt{font-size:12px;color:var(--mu);white-space:nowrap}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.doc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 12px}
.doc.run{border-color:var(--ac);box-shadow:0 0 0 3px var(--acb)}
.top{display:flex;gap:10px;align-items:center}.tt{flex:1;min-width:0}.tt b{display:block;font-size:13px}
.tt small{display:block;color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;background:var(--ln);color:var(--mu)}
.pass .ic,.skip .ic{background:var(--okb);color:var(--ok)}.fail .ic{background:var(--badb);color:var(--bad)}.review .ic{background:var(--wrb);color:var(--wr)}
.wait .ic{background:transparent;border:2px solid var(--ln)}
.sp{width:22px;height:22px;border-radius:50%;border:3px solid var(--acb);border-top-color:var(--ac);animation:r .8s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ln);color:var(--mu);white-space:nowrap}
.pass .tag,.skip .tag{background:var(--okb);color:var(--ok)}.fail .tag{background:var(--badb);color:var(--bad)}.review .tag{background:var(--wrb);color:var(--wr)}.run .tag{background:var(--acb);color:var(--ac)}
.body{margin:9px 0 0 34px;font-size:12px;color:var(--mu)}
.step{color:var(--tx);font-weight:600}.segs{display:flex;gap:4px;margin-top:7px}.segs i{flex:1;height:4px;border-radius:9px;background:var(--ln)}.segs i.on{background:var(--ac)}.segs i.cur{background:var(--ac);opacity:.45;animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:1}}
.iss{margin:6px 0 0;padding:0;display:grid;gap:4px}.iss li{background:var(--badb);color:var(--bad);border-radius:7px;padding:5px 8px;font-size:12px}
.review .iss li{background:var(--wrb);color:var(--wr)}
.lnk{background:none;border:0;color:var(--ac);font:600 12px system-ui;padding:6px 0 0;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}th,td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--ln);vertical-align:top;word-break:break-word}th{color:var(--mu);font-weight:600}
td.s{font-weight:700;width:18px}td.s.pass{color:var(--ok)}td.s.fail{color:var(--bad)}td.s.review{color:var(--wr)}
#sum{margin-top:10px}#sum[hidden]{display:none}.cnts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.c{font-weight:700;padding:4px 10px;border-radius:99px;font-size:12px}.c.pass{background:var(--okb);color:var(--ok)}.c.fail{background:var(--badb);color:var(--bad)}.c.review{background:var(--wrb);color:var(--wr)}
</style></head><body>
<header><div class="logo">✓</div><div><h1>Doc Verifier</h1><p id="sub">Document verification assistant</p></div><span id="conn" class="pill">Checking…</span></header>
<div id="notes"></div>
<section id="cand" class="card" hidden><b id="cn"></b><span id="cr"></span></section>
<div class="row"><button id="go" class="btn primary">Verify documents</button><button id="stop" class="btn" hidden>Stop</button></div>
<label class="sw"><input id="dry" type="checkbox" checked><span class="t"></span><span><b>Dry run</b><small>Check everything, but never tick the boxes</small></span></label>
<div id="bar" hidden><div class="track"><i id="fill"></i></div><span id="cnt"></span></div>
<ul id="docs"></ul>
<section id="sum" class="card" hidden><div class="cnts" id="cnts"></div><div class="row"><button id="apply" class="btn primary" hidden></button><button id="dl" class="btn">Download report</button></div></section>
<script src="panel.js"></script>
</body></html>
